name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - linux-kde
      - 'steelbrain/**'

permissions:
  contents: read

jobs:
  linux-test:
    name: Test (linux-amd64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev desktop-file-utils appstream

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build and test the tray and hardened helper
        run: scripts/build-linux.sh

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/org.hayatboj.msimux.desktop
          appstreamcli validate --no-net packaging/org.hayatboj.msimux.metainfo.xml

      - name: Stage and validate the offline bundle
        run: scripts/package-linux.sh "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --all-targets --target "$env:TARGET" -- -D warnings

      - name: Run tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$env:TARGET"

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$env:TARGET"
