name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint and test native Windows backend
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo clippy --locked --all-targets --target "$env:TARGET" -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target "$env:TARGET"

      - name: Lint and test native Linux backend
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build binary
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Install Qt build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev desktop-file-utils appstream

      - name: Validate Linux desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/org.hayatboj.msimux.desktop
          appstreamcli validate --no-net packaging/org.hayatboj.msimux.metainfo.xml

      - name: Package Windows archive
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target\$env:TARGET\release\msi-mux-switch.exe" staging\
          Copy-Item README.md, CHANGELOG.md, LICENSE staging\
          $archive = "$env:PLATFORM-msi-mux-switch.zip"
          Compress-Archive -Path staging\* -DestinationPath "dist\$archive"
          $hash = (Get-FileHash "dist\$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist\$archive.sha256" -Encoding ascii

      - name: Build and package Linux tray bundle
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag and Cargo package version must match' >&2
            exit 1
          fi
          scripts/build-linux.sh
          scripts/package-linux.sh "$version"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msi-mux-switch-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: msi-mux-switch-*
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          archives = sorted(p for p in Path('dist').iterdir() if p.name.endswith(('.zip', '.tar.gz')))
          if len(archives) != 2:
              raise SystemExit('Expected exactly Windows and Linux archives')
          lines = []
          for archive in archives:
              checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
              expected = f'{checksum}  {archive.name}\n'
              if archive.with_name(archive.name + '.sha256').read_text().strip() != expected.strip():
                  raise SystemExit(f'Checksum mismatch: {archive.name}')
              lines.append(expected)
          Path('dist/SHA256SUMS').write_text(''.join(lines))
          PY

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*-msi-mux-switch.zip
            dist/msi-mux-*-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
