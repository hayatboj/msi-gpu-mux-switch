name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target\$env:TARGET\release\msi-mux-switch.exe" staging\
          Copy-Item README.md, CHANGELOG.md, LICENSE staging\
          $archive = "$env:PLATFORM-msi-mux-switch.zip"
          Compress-Archive -Path staging\* -DestinationPath "dist\$archive"
          $hash = (Get-FileHash "dist\$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist\$archive.sha256" -Encoding ascii

      - name: Package Linux archive
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "target/$TARGET/release/msi-mux-switch" README.md CHANGELOG.md LICENSE staging/
          archive="$PLATFORM-msi-mux-switch.zip"
          (cd staging && python3 -m zipfile -c "../dist/$archive" ./*)
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msi-mux-switch-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}-msi-mux-switch.zip
            dist/${{ matrix.platform }}-msi-mux-switch.zip.sha256
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: msi-mux-switch-*
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS
          rm *.sha256

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*-msi-mux-switch.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
